<!doctype html>
<!-- Página única do painel admin. A lógica está em admin.js e o estilo em
     admin.css. Servida em /admin pelo server.js. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Handmade — Sistema de Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topo">
    <h1>Handmade<img src="/assets/handmade.svg" class="topo-logo" alt=""><span class="topo-sub">— Sistema de catálogo</span></h1>
    <div class="topo-acoes">
      <select id="seletor-categoria-pdf" class="topo-select" title="Categoria do PDF"></select>
      <button id="btn-pdf-2" class="botao botao-primario">PDF Catálogo</button>
      <button id="btn-pdf-3" class="botao botao-secundario">PDF sem preço</button>
    </div>
  </header>

  <main class="layout">
    <aside class="painel">
      <section class="bloco">
        <h2 id="titulo-form">Novo produto</h2>
        <form id="form-produto" class="form">
          <input type="hidden" name="id">
          <label>Categoria
            <select name="categoriaId" id="select-categoria-produto" required></select>
          </label>
          <div class="grid-2">
            <label>Código
              <span class="codigo-wrap">
                <span class="codigo-prefixo" id="codigo-prefixo-exibido"></span>
                <input name="codigo" required placeholder="001">
              </span>
            </label>
            <label>Preço (R$) <input name="preco" type="number" step="0.01" required></label>
          </div>
          <label>Nome <input name="nome" required></label>
          <label>Descrição curta <textarea name="descricao" rows="2"></textarea></label>
          <label>Nome da cor <input name="nomeCor" placeholder="Ex: Marrom envelhecido"></label>

          <div class="campo-arquivo">
            <label>Foto do produto (PNG sem fundo)</label>
            <input type="file" id="arquivo-foto" accept="image/*">
            <div class="preview" id="preview-foto"></div>
            <input type="hidden" name="foto">
          </div>
          <div class="campo-arquivo">
            <label>Recorte da textura do couro</label>
            <input type="file" id="arquivo-cor" accept="image/*">
            <div class="preview preview-cor" id="preview-cor"></div>
            <input type="hidden" name="corTextura">
          </div>

          <div class="acoes-form">
            <button type="button" id="btn-limpar" class="botao botao-fantasma">Limpar/Cancelar</button>
            <button type="submit" class="botao botao-primario" id="btn-salvar">Adicionar produto</button>
          </div>
        </form>
      </section>

      <section class="bloco">
        <h2>Categorias</h2>
        <form id="form-categoria" class="form">
          <input type="hidden" name="id">
          <div class="grid-cat">
            <label>Nome
              <input name="nome" placeholder="Ex: Cintos Masculino" required>
            </label>
            <label class="campo-prefixo">Prefixo
              <span class="prefixo-wrap">
                <input name="prefixoCodigo" placeholder="Ex: CM" maxlength="6" pattern="[A-Za-z0-9]*" autocomplete="off">
                <span class="prefixo-sufixo">-</span>
              </span>
            </label>
          </div>
          <div class="acoes-form">
            <button type="button" class="botao botao-fantasma escondido" id="btn-cancelar-categoria">Cancelar</button>
            <button type="submit" class="botao botao-primario" id="btn-salvar-categoria">Adicionar</button>
          </div>
        </form>
        <ul id="lista-categorias" class="lista-categorias"></ul>
      </section>

      <section class="bloco">
        <h2>Introdução</h2>
        <form id="form-intro" class="form">
          <label>Marca <input name="marca" required></label>
          <label>Subtítulo <input name="subtitulo"></label>
          <label>Texto introdutório <textarea name="texto" rows="4"></textarea></label>
          <div class="grid-2">
            <label>Ano <input name="ano" type="number"></label>
            <label>Instagram <input name="instagram"></label>
          </div>
          <label>WhatsApp <input name="whatsapp"></label>
          <button type="submit" class="botao botao-secundario">Salvar introdução</button>
        </form>
      </section>

      <section class="bloco bloco-senha">
        <h2>Segurança</h2>
        <button id="btn-trocar-senha" class="botao botao-fantasma botao-bloco">Trocar senha</button>
      </section>
    </aside>

    <section class="lista-painel">
      <div class="lista-cabecalho">
        <h2>Produtos cadastrados</h2>
        <div class="lista-cabecalho-acoes">
          <input type="search" id="busca-produto" class="filtro-lista filtro-busca" placeholder="Nome ou código...">
          <select id="filtro-categoria-lista" class="filtro-lista" title="Filtrar por categoria">
            <option value="">Todas as categorias</option>
          </select>
          <button id="btn-buscar" class="botao botao-secundario">Buscar</button>
          <div class="contador" id="contador">0 produtos</div>
        </div>
      </div>
      <div id="grupos" class="grupos"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
